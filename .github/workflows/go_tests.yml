name: Go Unit Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: go-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run Go Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: bikko
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: bikko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bikko -d bikko_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bikko:integration-only@127.0.0.1:5432/bikko_test?sslmode=disable

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Verify Module Integrity
        run: go mod verify

      - name: Build all API and migration entrypoints
        run: go build ./...

      - name: Run Unit and PostGIS Integration Tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-coverage
          path: coverage.out
          retention-days: 7
